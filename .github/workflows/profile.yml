name: Update profile SVGs

on:
  schedule:
    - cron: '0 15 * * *' # 00:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Render SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f login='${{ github.repository_owner }}' -f query='
            query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar {
              totalContributions weeks { contributionDays { weekday contributionLevel } } } } } }' \
            | python3 .github/scripts/contrib.py

      - name: Render Baekjoon tier
        continue-on-error: true # third-party badge; keep the last values if it is down
        run: curl -fsS "https://mazassumnida.wtf/api/v2/generate_badge?boj=sungmin9513" | python3 .github/scripts/boj.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: update profile SVGs" && git push)
